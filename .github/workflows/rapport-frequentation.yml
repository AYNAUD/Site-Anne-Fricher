name: Rapport quotidien de fréquentation (www.anne-fricher.com)

# Chaque matin, un courriel de totaux sur la veille : visiteurs, pages vues,
# pages les plus consultées, téléphones ou ordinateurs, pages introuvables (outils/rapport-frequentation.mjs). Les requêtes sont lues
# chez Cloudflare, le temps du calcul, puis oubliées : rien n'est conservé
# ni écrit dans le dépôt. Le courriel part de Gmail (SMTP, mot de passe
# d'application Google).
#
# Inactif tant que les réglages ne sont pas renseignés dans GitHub
# (Settings → Secrets and variables → Actions) :
#   - variable CF_ZONE_ID    : identifiant de la zone anne-fricher.com
#                              (tableau de bord Cloudflare, page d'accueil du
#                              domaine, colonne de droite « Zone ID »)
#   - secret   CF_API_TOKEN  : jeton Cloudflare (My Profile → API Tokens →
#                              Create Token → modèle « Read analytics and
#                              logs », limité à la zone anne-fricher.com)
#   - secret   GMAIL_ADRESSE        : l'adresse Gmail qui envoie (et reçoit)
#   - secret   GMAIL_MOT_DE_PASSE   : mot de passe d'application Google,
#                                     myaccount.google.com/apppasswords
#                                     (validation en deux étapes requise)
# Pour l'envoyer ailleurs : variable RAPPORT_DESTINATAIRE.

on:
  schedule:
    # Vers 4 h 37 UTC (5 h 37 ou 6 h 37 à Paris) ; GitHub retarde
    # parfois ses tâches planifiées.
    - cron: '37 4 * * *'
  workflow_dispatch:
    inputs:
      jour:
        description: "Journée à analyser (AAAA-MM-JJ) ; vide : hier"
        type: string
        default: ''
      essai:
        description: "Essai : afficher le rapport dans le journal de la tâche, sans l'envoyer"
        type: boolean
        default: false

concurrency:
  group: rapport-frequentation
  cancel-in-progress: false

jobs:
  rapport:
    if: vars.CF_ZONE_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Calculer et envoyer le rapport
        env:
          CF_ZONE_ID: ${{ vars.CF_ZONE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          GMAIL_ADRESSE: ${{ secrets.GMAIL_ADRESSE }}
          GMAIL_MOT_DE_PASSE: ${{ secrets.GMAIL_MOT_DE_PASSE }}
          RAPPORT_DESTINATAIRE: ${{ vars.RAPPORT_DESTINATAIRE }}
          JOUR: ${{ inputs.jour }}
          ESSAI: ${{ inputs.essai && '--essai' || '' }}
        run: node outils/rapport-frequentation.mjs $JOUR $ESSAI
